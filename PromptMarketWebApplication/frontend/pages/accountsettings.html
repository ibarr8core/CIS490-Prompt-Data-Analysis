<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container" style="max-width: 480px;">
      <h1 class="h2 mb-3">Account Settings</h1>
      <div class="card mb-3">
        <h3 class="h4 mb-2">Update profile</h3>
        <form id="settingsForm">
          <div class="form-group">
            <label class="form-label" for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Avatar Style</label>
            <div class="avatar-style-picker" id="avatarStylePicker"></div>
            <input type="hidden" id="avatarStyle" name="avatarStyle" value="adventurer">
          </div>
          <button type="submit" class="btn btn-primary">Save profile</button>
        </form>
      </div>
      <div class="card mb-3">
        <h3 class="h4 mb-2">Change password</h3>
        <form id="changePasswordForm">
          <div class="form-group">
            <label class="form-label" for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" name="currentPassword" class="form-input" autocomplete="current-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword" class="form-input" autocomplete="new-password">
            <p class="form-hint">At least 8 characters, one uppercase, one number, one special character</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="verifyPassword">Verify new password</label>
            <input type="password" id="verifyPassword" name="verifyPassword" class="form-input" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>
      </div>
      <div class="card">
        <h3 class="h4 mb-2 text-muted">Danger zone</h3>
        <button type="button" class="btn btn-danger" id="deleteAccountBtn">Delete account</button>
      </div>
    </div>
  </main>
  <div class="modal-overlay hidden" id="deleteConfirmModal">
    <div class="modal">
      <h3>Delete account?</h3>
      <p>This cannot be undone. All your data will be removed.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modalCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="modalConfirm">Delete account</button>
      </div>
    </div>
  </div>
  <script src="../config.js"></script>
  <script src="../app.js" defer></script>
</body>
</html>
