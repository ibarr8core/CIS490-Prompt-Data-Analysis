<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container container-narrow" style="padding-top: 2rem;">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <img src="../img/csusm_logo_full.jpg" alt="California State University San Marcos" style="max-width: 220px; width: 100%;">
      </div>
      <div class="card">
        <h2 class="h2 mb-3">Reset password</h2>
        <div id="resetMessage" class="msg" style="display: none;"></div>
        <form id="resetForm">
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="New password" autocomplete="new-password">
            <p class="form-hint">At least 8 characters, one uppercase, one number, one special character</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="verify">Verify password</label>
            <input type="password" id="verify" name="verify" class="form-input" placeholder="Verify password" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Reset password</button>
        </form>
        <p class="mt-3 text-small"><a href="../pages/login.html" id="loginLinkReset">Back to login</a></p>
      </div>
    </div>
  </main>
  <script src="../config.js"></script>
  <script src="../app.js" defer></script>
</body>
</html>
