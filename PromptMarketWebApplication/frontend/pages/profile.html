<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container">
      <div id="profileContent">
        <div class="profile-layout">
          <div>
            <h1 class="h1" id="profileUsername">Username</h1>
            <p class="text-muted mb-3" id="profileStats">0 followers · 0 following</p>
            <div class="tabs" id="profileTabsContent">
              <button type="button" class="tab active" data-tab="posts">Posts</button>
              <button type="button" class="tab" data-tab="comments">Comments</button>
              <button type="button" class="tab" data-tab="saved">Saved</button>
              <button type="button" class="tab" data-tab="upvoted">Upvoted</button>
              <button type="button" class="tab" data-tab="downvoted">Downvoted</button>
            </div>
            <div id="profilePosts" class="grid-prompts mt-2"></div>
            <div id="profileComments" class="mt-2" style="display: none;"></div>
            <div id="profileSaved" class="grid-prompts mt-2" style="display: none;"></div>
            <div id="profileUpvoted" class="grid-prompts mt-2" style="display: none;"></div>
            <div id="profileDownvoted" class="grid-prompts mt-2" style="display: none;"></div>
          </div>
          <div class="achievements-panel">
            <div id="avatarDisplay" class="avatar-display"></div>
            <div id="avatarCustomizer"></div>
            <h3>Achievements</h3>
            <div id="achievementsList"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="../app.js" defer></script>
</body>
</html>
