<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore — PawPrompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container">
      <div class="explore-layout">
        <aside>
          <div class="filter-panel" id="filterModel">
            <h3>Model</h3>
            <div class="filter-group">
              <label><input type="radio" name="model" value="All" checked> All</label>
              <label><input type="radio" name="model" value="ChatGPT"> ChatGPT</label>
              <label><input type="radio" name="model" value="Claude"> Claude</label>
              <label><input type="radio" name="model" value="Gemini"> Gemini</label>
              <label><input type="radio" name="model" value="Sora"> Sora</label>
              <label><input type="radio" name="model" value="Cursor"> Cursor</label>
              <label><input type="radio" name="model" value="Copilot"> Copilot</label>
            </div>
          </div>
          <div class="filter-panel" id="filterCategory">
            <h3>Category</h3>
            <div class="filter-group">
              <label><input type="radio" name="category" value="" checked> All</label>
              <label><input type="radio" name="category" value="Academic Writing"> Academic Writing</label>
              <label><input type="radio" name="category" value="Coding & Development"> Coding & Development</label>
              <label><input type="radio" name="category" value="Study & Exam Prep"> Study & Exam Prep</label>
              <label><input type="radio" name="category" value="Research and Analysis"> Research and Analysis</label>
              <label><input type="radio" name="category" value="Design & Media"> Design & Media</label>
              <label><input type="radio" name="category" value="Career & Professional"> Career & Professional</label>
              <label><input type="radio" name="category" value="Productivity & Organization"> Productivity & Organization</label>
              <label><input type="radio" name="category" value="AI Automation"> AI Automation</label>
            </div>
          </div>
        </aside>
        <div>
          <div class="sort-wrap">
            <label for="sortSelect">Sort by</label>
            <select id="sortSelect">
              <option value="trending">Trending</option>
              <option value="new">New</option>
              <option value="top">Top</option>
            </select>
          </div>
          <h2 class="section-title">Trending Prompts</h2>
          <div class="grid-prompts" id="explorePrompts"></div>
          <h2 class="section-title mt-4">Most Popular Creators</h2>
          <div class="grid-prompts" id="exploreCreators"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="../config.js"></script>
  <script src="../app.js" defer></script>
</body>
</html>
