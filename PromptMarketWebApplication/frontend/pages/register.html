<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — PawPrompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container container-narrow" style="padding-top: 2rem;">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <img src="../img/csusm_logo_full.jpg" alt="California State University San Marcos" style="max-width: 220px; width: 100%;">
      </div>
      <div class="card">
        <h2 class="h2 mb-3">Register</h2>
        <div id="registerMessage" class="msg" style="display: none;"></div>
        <form id="registerForm">
          <div class="form-group">
            <label class="form-label" for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Full name" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Email" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Username" autocomplete="username">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Password" autocomplete="new-password">
            <p class="form-hint">At least 8 characters, one uppercase, one number, one special character</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="verify">Verify password</label>
            <input type="password" id="verify" name="verify" class="form-input" placeholder="Verify password" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
        <p class="mt-3 text-small"><a href="../pages/login.html" id="loginLinkRegister">Already have an account? Login</a></p>
      </div>
    </div>
  </main>
  <script src="../config.js"></script>
  <script src="../app.js" defer></script>
</body>
</html>
