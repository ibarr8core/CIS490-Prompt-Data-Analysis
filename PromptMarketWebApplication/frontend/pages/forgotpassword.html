<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container container-narrow" style="padding-top: 2rem;">
      <div class="card">
        <h2 class="h2 mb-3">Forgot password</h2>
        <p class="text-muted mb-3">Enter your email and we'll send you a reset link.</p>
        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Email" autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>
        <div id="forgotSuccess" class="msg msg-success mt-3" style="display: none;"></div>
        <p class="mt-3 text-small"><a href="../pages/login.html" id="backToLoginForgot">Back to login</a></p>
      </div>
    </div>
  </main>
  <script src="../app.js" defer></script>
</body>
</html>
