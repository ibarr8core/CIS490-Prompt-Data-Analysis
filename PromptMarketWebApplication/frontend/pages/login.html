<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in – Prompt Marketplace</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-layout">
      <div class="auth-card">
        <div class="auth-card-header">Log in to your account</div>
        <div class="auth-card-body">
          <form action="#" method="post">
            <div class="form-group">
              <label for="login-username">Username</label>
              <input type="text" id="login-username" name="username" placeholder="Username" autocomplete="username">
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
          <div class="auth-card-links">
            <p><a href="#">Forgot password?</a></p>
            <p>Don't have an account? <a href="register.html">Register</a></p>
          </div>
        </div>
      </div>
      <aside class="auth-callout">
        <h3>Error messages</h3>
        <ul>
          <li>Invalid username or password.</li>
          <li>Account locked after 5 failed attempts.</li>
        </ul>
      </aside>
    </div>
  </div>
</body>
</html>
