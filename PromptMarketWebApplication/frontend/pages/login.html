<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Prompt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container container-narrow" style="padding-top: 2rem;">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <img src="../img/csusm_logo_full.jpg" alt="California State University San Marcos" style="max-width: 220px; width: 100%;">
      </div>
      <div class="card">
        <h2 class="h2 mb-3">Login</h2>
        <div id="loginMessage" class="msg" style="display: none;"></div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="emailOrUsername">Email or username</label>
            <input type="text" id="emailOrUsername" name="emailOrUsername" class="form-input" placeholder="Email or username" autocomplete="username">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="mt-3 text-small"><a href="../pages/forgotpassword.html" id="forgotLinkLogin">Forgot password?</a></p>
        <p class="text-small"><a href="../pages/register.html" id="registerLinkLogin">Register</a></p>
      </div>
    </div>
  </main>
  <script src="../config.js"></script>
  <script src="../app.js" defer></script>
</body>
</html>
