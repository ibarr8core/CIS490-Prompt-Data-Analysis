<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawPrompt — AI Prompt Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="page">
    <div class="container container-narrow" style="text-align: center; padding-top: 3rem;">
      <img src="img/csusm_logo_full.jpg" alt="California State University San Marcos" style="max-width: 280px; width: 100%; margin-bottom: 1.5rem; display: block; margin-left: auto; margin-right: auto;">
      <h1 class="h1">PawPrompt</h1>
      <p class="text-muted mb-4">Share and discover AI prompts</p>
      <div id="loggedOutBlock">
        <a href="pages/login.html" class="btn btn-primary mt-2" id="goLogin">Login</a>
        <a href="pages/register.html" class="btn btn-outline mt-2" id="goRegister">Register</a>
        <a href="pages/explore.html" class="btn btn-outline mt-2" id="continueExplore">Continue to Explore</a>
        <p class="mt-3 text-small"><a href="pages/forgotpassword.html" id="forgotLink">Forgot password?</a></p>
      </div>
      <div id="loggedInBlock" style="display: none;">
        <a href="pages/explore.html" class="btn btn-primary mt-2">Continue to Explore</a>
      </div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="app.js" defer></script>

</html>
